<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>芝春 · 情感陪伴</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>芝春 · 情感陪伴</h1>
      <div class="header-meta" id="headerMeta"></div>
    </header>

    <div class="chat" id="chat"></div>

    <form class="composer" id="composer">
      <input
        type="text"
        id="input"
        placeholder="和我说点什么吧…"
        maxlength="2000"
        autocomplete="off"
      />
      <button type="submit" id="sendBtn">发送</button>
    </form>
  </div>

  <!-- 首次访问时填入 token（存 localStorage）-->
  <div class="modal" id="tokenModal">
    <div class="modal-box">
      <h2>访问令牌</h2>
      <p>服务端开启了鉴权，请输入访问 Token（可选，留空则直接进入）。</p>
      <input type="password" id="tokenInput" placeholder="API Token" />
      <button id="tokenSave">进入</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
